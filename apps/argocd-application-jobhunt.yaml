apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jon-hunt
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/felipevarejao/life-ops-hub'
    targetRevision: HEAD
    path: apps/job-hunt
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: job-hunt
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true