apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alloy-config
  namespace: monitoring
data:
  config.alloy: |
    // Ativa o receptor local para suas aplicações Python enviarem dados
    otelcol.receiver.otlp "default" {
      grpc { endpoint = "0.0.0.0:4317" }
      http { endpoint = "0.0.0.0:4318" }
      output {
        metrics = [otelcol.exporter.otlp.grafana_cloud.input]
        traces  = [otelcol.exporter.otlp.grafana_cloud.input]
      }
    }

    // Configura o envio seguro para a nuvem do Grafana Cloud
    otelcol.exporter.otlp "grafana_cloud" {
      client {
        endpoint = "https://grafana.net"
        auth     = otelcol.auth.basic.grafana.handler
      }
    }

    otelcol.auth.basic "grafana" {
      username = "1846326"
      password = env("GRAFANA_CLOUD_TOKEN")
    }
