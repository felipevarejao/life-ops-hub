apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-alloy
  namespace: monitoring
  labels:
    app: grafana-alloy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-alloy
  template:
    metadata:
      labels:
        app: grafana-alloy
    spec:
      containers:
      - name: alloy
        image: grafana/alloy:v1.0.0
        resources:
          limits:
            cpu: "200m"       # Limita a no máximo 20% de 1 núcleo de CPU
            memory: "100Mi"   # Limita estritamente a 100 Megabytes de RAM
          requests:
            cpu: "50m"        # Reserva inicial de 5% de CPU
            memory: "50Mi"    # Reserva inicial de apenas 50 Megabytes de RAM
        # ------------------------------------------------
        args:
        - run
        - /etc/alloy/config.alloy
        - --storage.path=/var/lib/alloy/data
        ports:
        - name: otlp-grpc
          containerPort: 4317
        - name: otlp-http
          containerPort: 4318
        env:
        - name: GRAFANA_CLOUD_TOKEN
          valueFrom:
            secretKeyRef:
              name: grafana-cloud-credentials
              key: GRAFANA_CLOUD_TOKEN
        volumeMounts:
        - name: config
          mountPath: /etc/alloy
        - name: storage
          mountPath: /var/lib/alloy/data
      volumes:
      - name: config
        configMap:
          name: grafana-alloy-config
      - name: storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-alloy
  namespace: monitoring
spec:
  selector:
    app: grafana-alloy
  ports:
  - name: otlp-grpc
    protocol: TCP
    port: 4317
    targetPort: 4317
  - name: otlp-http
    protocol: TCP
    port: 4318
    targetPort: 4318
