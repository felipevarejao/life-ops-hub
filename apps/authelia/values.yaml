# apps/authelia/values.yaml

configMap:
  theme: dark

  server:
    path: "auth"

  session:
    cookies:
      - domain: k3s-control-plane-1.tail783ccb.ts.net
        default_redirection_url: https://auth.k3s-control-plane-1.tail783ccb.ts.net/auth

  storage:
    local:
      enabled: true
      path: /config/db.sqlite

  notifier:
    filesystem:
      enabled: true
      filename: /config/notification.txt

  authentication_backend:
    file:
      enabled: true
      path: /secrets/users_database.yml

  access_control:
    default_policy: deny
    rules:
      - domain: "*.k3s-control-plane-1.tail783ccb.ts.net"
        policy: one_factor

secret:
  existingSecret: "authelia-secrets"

# Montagem de Secrets adicionais aceita pelo Schema do Authelia Chart
pod:
  extraVolumes:
    - name: user-db-volume
      secret:
        secretName: authelia-user-password-db
        items:
          - key: users_database.yml
            path: users_database.yml
  extraVolumeMounts:
    - name: user-db-volume
      mountPath: /secrets/users_database.yml
      subPath: users_database.yml
      readOnly: true