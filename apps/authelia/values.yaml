# apps/authelia/values.yaml

configMap:
  theme: dark

  server:
    path: "auth"

  session:
    cookies:
      - domain: k3s-control-plane-1.tail783ccb.ts.net
        default_redirection_url: https://auth.k3s-control-plane-1.tail783ccb.ts.net/auth

  # --- BANCO DE DADOS POSTGRESQL ---
  storage:
    local:
      enabled: false

    postgres:
      enabled: true
      address: 'tcp://postgres-cluster-rw.database.svc.cluster.local:5432'
      database: 'authelia'
      username: 'authelia_user'
      password:
        path: '/secrets/postgres/password'

  notifier:
    filesystem:
      enabled: true
      filename: /config/notification.txt

  authentication_backend:
    file:
      enabled: true
      path: /secrets/users_database.yml

  access_control:
    default_policy: deny
    rules:
      - domain: "*.k3s-control-plane-1.tail783ccb.ts.net"
        policy: one_factor

secret:
  existingSecret: "authelia-secrets"

pod:
  extraVolumes:
    # A chave users_database.yml pertence ao authelia-secrets
    - name: user-db-volume
      secret:
        secretName: authelia-secrets
        items:
          - key: users_database.yml
            path: users_database.yml
    # A chave password pertence ao authelia-user-password-db
    - name: postgres-secret-volume
      secret:
        secretName: authelia-user-password-db
        items:
          - key: password
            path: password

  extraVolumeMounts:
    - name: user-db-volume
      mountPath: /secrets/users_database.yml
      subPath: users_database.yml
      readOnly: true
    - name: postgres-secret-volume
      mountPath: /secrets/postgres/password
      subPath: password
      readOnly: true