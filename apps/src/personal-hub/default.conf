server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Devolve o nome do usuário logado (header do authentik) para a página saudar pelo nome.
  location = /me {
    charset utf-8;
    default_type text/plain;
    add_header Cache-Control "no-store";
    return 200 "$http_x_authentik_name";
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
