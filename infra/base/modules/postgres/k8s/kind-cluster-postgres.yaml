apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-cluster
  namespace: database
spec:
  instances: 1
  storage:
    size: 2Gi
    storageClass: longhorn
  bootstrap:
    initdb:
      database: jobhunt_db
      owner: jobhunt_user
  managed:
    roles:
      - name: authelia_user
        ensure: present
        login: true
        passwordSecret:
          name: authelia-user-password